server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bulwark}
    username: ${DB_USER:bulwark}
    password: ${DB_PASSWORD:bulwark}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDERS_URI:http://localhost:8081}
              predicates:
                - Path=/orders,/orders/**
            - id: users
              uri: ${USERS_URI:http://localhost:8082}
              predicates:
                - Path=/users,/users/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
