server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bulwark}
    username: ${DB_USER:bulwark}
    password: ${DB_PASSWORD:bulwark}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDERS_URI:http://localhost:8081}
              predicates:
                - Path=/orders,/orders/**
            - id: users
              uri: ${USERS_URI:http://localhost:8082}
              predicates:
                - Path=/users,/users/**

bulwark:
  rate-limit:
    # Token bucket per client tier: capacity = max burst, refill-per-second = sustained rate.
    tiers:
      free:
        capacity: 20
        refill-per-second: 10
      pro:
        capacity: 100
        refill-per-second: 50
  client-cache:
    ttl: ${CLIENT_CACHE_TTL:60s}
    max-size: ${CLIENT_CACHE_MAX_SIZE:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
