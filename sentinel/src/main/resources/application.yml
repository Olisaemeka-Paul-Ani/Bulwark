server:
  port: ${PORT:8090}

spring:
  application:
    name: sentinel
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sentinel:
  model:
    # Most recent windows kept as training data.
    training-buffer-size: 20000
    min-training-windows: 50
    trees: 200
    subsample: 0.7
    path: ${MODEL_PATH:models/isolation-forest.bin}
  window:
    size: 30s
    # How long after a window ends it stays open for late events (e.g. from the other gateway).
    grace: 5s
  stream:
    group: sentinel
    # Run one sentinel. The group hands out entries per message, not per client, so a second
    # replica would see only part of each client's window.
    consumer: ${HOSTNAME:sentinel-1}
    batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info
