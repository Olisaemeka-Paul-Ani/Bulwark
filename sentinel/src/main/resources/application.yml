server:
  port: ${PORT:8090}

spring:
  application:
    name: sentinel
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sentinel:
  window:
    size: 30s
    # How long after a window ends it stays open for late events (e.g. from the other gateway).
    grace: 5s
  stream:
    group: sentinel
    # Unique per sentinel instance so a second replica would share the work, not duplicate it.
    consumer: ${HOSTNAME:sentinel-1}
    batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info
