# Local stack. Run from the repo root: docker compose -f infra/docker-compose.yml up --build
# Credentials default to local-only dev values; override them with env vars or an untracked .env.
name: bulwark

x-java-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bulwark}
      POSTGRES_USER: ${POSTGRES_USER:-bulwark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulwark}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-orders:
    build:
      context: ..
      dockerfile: demo-orders/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      <<: *java-healthcheck

  demo-users:
    build:
      context: ..
      dockerfile: demo-users/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      <<: *java-healthcheck

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      ORDERS_URI: http://demo-orders:8081
      USERS_URI: http://demo-users:8082
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo-orders:
        condition: service_healthy
      demo-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      <<: *java-healthcheck

volumes:
  pgdata:
