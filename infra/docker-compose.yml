# Local stack. Run from the repo root: docker compose -f infra/docker-compose.yml up --build
# Credentials default to local-only dev values; override them with env vars or an untracked .env.
name: bulwark

x-java-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bulwark}
      POSTGRES_USER: ${POSTGRES_USER:-bulwark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulwark}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-orders:
    build:
      context: ..
      dockerfile: demo-orders/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      <<: *java-healthcheck

  demo-users:
    build:
      context: ..
      dockerfile: demo-users/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      <<: *java-healthcheck

  gateway-1: &gateway
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment: &gateway-env
      GATEWAY_NODE: gateway-1
      ORDERS_URI: http://demo-orders:8081
      USERS_URI: http://demo-users:8082
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_NAME: ${POSTGRES_DB:-bulwark}
      DB_USER: ${POSTGRES_USER:-bulwark}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bulwark}
    ports:
      - "8091:8080"   # direct access to this replica, bypassing nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo-orders:
        condition: service_healthy
      demo-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      <<: *java-healthcheck

  gateway-2:
    <<: *gateway
    environment:
      <<: *gateway-env
      GATEWAY_NODE: gateway-2
    ports:
      - "8092:8080"

  sentinel:
    build:
      context: ..
      dockerfile: sentinel/Dockerfile
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bulwark}
      DB_USER: ${POSTGRES_USER:-bulwark}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bulwark}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health"]
      <<: *java-healthcheck

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
